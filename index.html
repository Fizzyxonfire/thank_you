<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f4f4f4;
    }
    .thank-you-box {
      background: white;
      padding: 40px;
      margin: auto;
      border-radius: 10px;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #4CAF50;
    }

</head>
<body>
  <div class="thank-you-box">
    <h1>Thank You for Your Purchase!</h1>
    <p>Your transaction was successful.</p>
  </div>
</body>
</html>
